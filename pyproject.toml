[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacture-jis"
version = "0.1.0"
dependencies = [
  "openpyxl",
  "pandas",
  "ortools",
  "xlsxwriter>=3.2.9",
  "pytest>=9.0.3",
  "loguru>=0.7.3",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "jinja2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
